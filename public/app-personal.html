<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistencia - Servicio Social</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Escáner QR HTML5 en Navegador -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-20 font-sans antialiased">

    <!-- HEADER MÓVIL -->
    <header class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-10 flex justify-between items-center">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs" id="user-avatar">
                --
            </div>
            <div>
                <h1 class="text-sm font-bold text-gray-900 leading-none" id="user-nombre">Cargando...</h1>
                <p class="text-xs text-gray-400 mt-0.5" id="user-nc">NC: ----</p>
            </div>
        </div>

        <div class="flex items-center gap-1">
            <button onclick="abrirModalPassword()" class="p-2 text-gray-400 hover:text-gray-600 rounded-xl hover:bg-gray-100" title="Cambiar contraseña">
                <i data-lucide="key-round" class="w-5 h-5"></i>
            </button>
            <button onclick="cerrarSesion()" class="p-2 text-gray-400 hover:text-rose-600 rounded-xl hover:bg-gray-100" title="Cerrar sesión">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- CONTENIDO DINÁMICO DE PESTAÑAS -->
    <main class="p-4 max-w-lg mx-auto">

        <!-- PESTAÑA 1: ESCÁNER QR -->
        <section id="sec-escaner" class="block">
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm text-center mb-4">
                <h2 class="text-lg font-bold text-gray-900 mb-1">Registrar Asistencia</h2>
                <p class="text-xs text-gray-500 mb-4">Apunta con la cámara al código QR dinámico del monitor.</p>

                <!-- Cámara de Escaneo -->
                <div class="overflow-hidden rounded-2xl border-2 border-gray-200 bg-black max-w-xs mx-auto">
                    <div id="reader" class="w-full"></div>
                </div>

                <!-- Mensaje de Feedback tras escaneo -->
                <div id="mensaje-resultado" class="mt-4 p-3 rounded-xl text-xs font-semibold hidden"></div>
            </div>
        </section>

        <!-- PESTAÑA 2: MIS REPORTES (SOLO LECTURA) -->
        <section id="sec-reportes" class="hidden">
            
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm mb-4 flex justify-between items-center">
                <div>
                    <p class="text-xs font-medium text-gray-400">Total Registros Acumulados</p>
                    <p class="text-2xl font-bold text-gray-900 mt-0.5" id="total-registros">0</p>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                    <i data-lucide="award" class="w-6 h-6"></i>
                </div>
            </div>

            <!-- Historial Personal -->
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                    <h3 class="font-bold text-gray-900 text-sm">Mis Registros Recientes</h3>
                    <span class="text-xs text-gray-400 font-medium">Solo lectura</span>
                </div>

                <div class="divide-y divide-gray-100 text-xs" id="lista-mis-asistencias">
                    <div class="p-4 text-center text-gray-400">Cargando tus reportes...</div>
                </div>
            </div>

        </section>

    </main>

    <!-- NAVEGACIÓN INFERIOR (MÓVIL) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-2 flex justify-around items-center z-10 max-w-lg mx-auto">
        <button onclick="cambiarTab('escaner')" id="btn-tab-escaner" class="flex flex-col items-center text-blue-600 font-medium text-xs">
            <i data-lucide="qr-code" class="w-5 h-5 mb-1"></i>
            <span>Escanear</span>
        </button>

        <button onclick="cambiarTab('reportes')" id="btn-tab-reportes" class="flex flex-col items-center text-gray-400 hover:text-gray-600 font-medium text-xs">
            <i data-lucide="file-text" class="w-5 h-5 mb-1"></i>
            <span>Mis Reportes</span>
        </button>
    </nav>

    <!-- MODAL: CAMBIAR CONTRASEÑA PERSONAL -->
    <div id="modal-password" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
            <h3 class="font-bold text-gray-900 text-base mb-1">Cambiar Contraseña</h3>
            <p class="text-xs text-gray-500 mb-4">Ingresa tu contraseña actual y la nueva contraseña que utilizarás.</p>

            <form id="form-password" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña Actual</label>
                    <input type="password" id="pass-actual" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nueva Contraseña</label>
                    <input type="password" id="pass-nueva" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
                </div>

                <div id="msg-pass-error" class="text-xs text-rose-500 font-semibold hidden"></div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="cerrarModalPassword()" class="w-1/2 py-2 border border-gray-200 text-gray-600 rounded-xl text-xs font-semibold">Cancelar</button>
                    <button type="submit" class="w-1/2 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LÓGICA DE JAVASCRIPT -->
    <script>
        lucide.createIcons();
        const token = localStorage.getItem('jwt_token');

        if (!token) {
            window.location.href = '/login.html';
        }

        // Cargar datos del usuario guardados tras el login
        const usuario = JSON.parse(localStorage.getItem('usuario_info') || '{}');
        if (usuario.nombre) {
            document.getElementById('user-nombre').innerText = usuario.nombre;
            document.getElementById('user-nc').innerText = "NC: " + usuario.numeroControl;
            document.getElementById('user-avatar').innerText = usuario.nombre.substring(0, 2).toUpperCase();
        }

            // Función para enviar el token QR escaneado al backend
async function enviarEscaneoQR(qrToken) {
    try {
        const response = await fetch('/api/asistencia/registrar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('jwt_token')
            },
            body: JSON.stringify({ qrToken })
        });

        const data = await response.json();

        if (response.ok && data.exito) {
            // Mostrar notificación con el resultado automático y las horas acumuladas
            alert(data.mensaje);
            // Recargar la tabla local de reportes del alumno
            if (typeof cargarMisReportes === 'function') {
                cargarMisReportes();
            }
        } else {
            alert(data.mensaje || "Error al registrar la asistencia.");
        }
    } catch (error) {
        console.error("Error en la petición de asistencia:", error);
        alert("Error de conexión con el servidor.");
    }
}

        // Cargar historial de reportes del propio usuario
        async function cargarMisReportes() {
            try {
                const res = await fetch('/api/asistencia/mis-reportes', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                const data = await res.json();
                const contenedor = document.getElementById('lista-mis-asistencias');
                const asistencias = data.asistencias || [];

                document.getElementById('total-registros').innerText = asistencias.length;

                if (asistencias.length === 0) {
                    contenedor.innerHTML = `<div class="p-4 text-center text-gray-400">No tienes asistencias registradas.</div>`;
                    return;
                }

                contenedor.innerHTML = asistencias.map(a => `
                    <div class="p-3.5 flex justify-between items-center hover:bg-gray-50">
                        <div>
                            <p class="font-semibold text-gray-900">${new Date(a.fecha_hora).toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' })}</p>
                            <p class="text-gray-400 font-mono mt-0.5">${new Date(a.fecha_hora).toLocaleTimeString()}</p>
                        </div>
                        <span class="bg-emerald-50 text-emerald-600 font-medium px-2.5 py-1 rounded-full">Registrado</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Error al cargar reportes:", err);
            }
        }

        // Cambiar Contraseña del Usuario
        document.getElementById('form-password').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgError = document.getElementById('msg-pass-error');
            msgError.classList.add('hidden');

            const payload = {
                passwordActual: document.getElementById('pass-actual').value,
                nuevaPassword: document.getElementById('pass-nueva').value
            };

            try {
                const res = await fetch('/api/usuario/cambiar-password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    alert("¡Contraseña actualizada correctamente!");
                    cerrarModalPassword();
                } else {
                    msgError.innerText = data.mensaje || "Error al actualizar la contraseña";
                    msgError.classList.remove('hidden');
                }
            } catch (err) {
                msgError.innerText = "Error al conectar con el servidor";
                msgError.classList.remove('hidden');
            }
        });

        // Control de Pestañas Móviles
        function cambiarTab(tab) {
            const secEscaner = document.getElementById('sec-escaner');
            const secReportes = document.getElementById('sec-reportes');
            const btnEscaner = document.getElementById('btn-tab-escaner');
            const btnReportes = document.getElementById('btn-tab-reportes');

            if (tab === 'escaner') {
                secEscaner.classList.remove('hidden');
                secReportes.classList.add('hidden');
                btnEscaner.className = "flex flex-col items-center text-blue-600 font-medium text-xs";
                btnReportes.className = "flex flex-col items-center text-gray-400 font-medium text-xs";
            } else {
                secEscaner.classList.add('hidden');
                secReportes.classList.remove('hidden');
                btnReportes.className = "flex flex-col items-center text-blue-600 font-medium text-xs";
                btnEscaner.className = "flex flex-col items-center text-gray-400 font-medium text-xs";
                cargarMisReportes();
            }
        }

        function abrirModalPassword() { document.getElementById('modal-password').classList.remove('hidden'); }
        function cerrarModalPassword() { document.getElementById('modal-password').classList.add('hidden'); }

        function cerrarSesion() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('usuario_info');
            window.location.href = '/login.html';
        }

        // Inicializar la Cámara del Móvil
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
        html5QrcodeScanner.render((decodedText) => {
            registrarAsistencia(decodedText);
        });
    </script>
</body>
</html>
