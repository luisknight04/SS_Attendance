<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Control de Asistencia</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Íconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center p-3 bg-blue-600 rounded-2xl mb-3 text-white">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold">Control de Asistencia</h1>
            <p class="text-xs text-slate-400 mt-1">Ingresa con tu Número de Control o Identificador de usuario.</p>
        </div>

        <form id="form-login-general" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Número de Control / Identificador</label>
                <input type="text" id="login-nc" required placeholder="Ej. 22110102 o ADM-01" 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••" 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div id="error-login-msg" class="text-xs text-rose-400 font-semibold hidden"></div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 font-semibold rounded-xl text-sm transition-all shadow-lg">
                Iniciar Sesión
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('form-login-general').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('error-login-msg');
            errorMsg.classList.add('hidden');

            const numeroControl = document.getElementById('login-nc').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numeroControl, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Guardar el token y los datos de usuario en localStorage
                    localStorage.setItem('jwt_token', data.token);
                    localStorage.setItem('usuario_info', JSON.stringify(data.usuario));

                    // Redirección inteligente basada en el rol del usuario
                    if (data.usuario.rol === 'ADMIN') {
                        window.location.href = '/dashboard.html';
                    } else if (data.usuario.rol === 'DISPLAY') {
                        localStorage.setItem('display_jwt_token', data.token);
                        window.location.href = '/monitor.html';
                    } else {
                        window.location.href = '/app-personal.html';
                    }
                } else {
                    errorMsg.innerText = data.mensaje || "Credenciales incorrectas";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = "Error de conexión con el servidor";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
